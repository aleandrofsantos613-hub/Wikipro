
name: Publicar WikiPro

on:
  push:
    branches: ["main"]
    paths:
      - "WikiPro-Nova.zip"
      - ".github/workflows/deploy-wikipro.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar site
        run: |
          set -euo pipefail

          echo "Conferindo ZIP atual..."
          ls -lh WikiPro-Nova.zip
          unzip -tq WikiPro-Nova.zip

          rm -rf _site _site_extracted
          mkdir -p _site _site_extracted

          unzip -q WikiPro-Nova.zip -d _site_extracted

          cp -a _site_extracted/wikipro/. _site/

          echo "Conferindo arquivos do site..."
          test -f _site/index.html
          test -f _site/css/style.css
          test -f _site/js/script.js
          test -f _site/images/dificuldade/0.webp
          test -f _site/images/dificuldade/1.webp
          test -f _site/images/nivel-1/pagina-1.png
          test -f _site/images/nivel-1/pagina-2.png
          test -f _site/images/nivel-1/pagina-3.png

          echo "Site preparado com sucesso!"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
