
name: Publicar WikiPro

on:
  push:
    branches: ["main"]
    paths:
      - "WikiPro.zip"
      - ".github/workflows/deploy-wikipro.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar arquivos do site a partir do ZIP
        run: |
          rm -rf _site extracted
          mkdir -p _site extracted
          unzip -q WikiPro.zip -d extracted
          cp -a extracted/wikipro/. _site/
          test -f _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
