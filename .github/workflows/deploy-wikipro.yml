
name: "WikiProNova.zip"

on:
  push:
    branches: ["main"]
    paths:
      - "WikiProNova.zip"
      - ".github/workflows/deploy-wikipro.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar arquivos do site
        run: |
          rm -rf _site extracted
          mkdir -p _site extracted

          unzip -q WikiProNova.zip -d extracted

          cp -a extracted/wikipro/. _site/

          python3 - <<'PY'
          from pathlib import Path

          file = Path("_site/js/script.js")
          content = file.read_text(encoding="utf-8")

          content = content.replace(
              '<p class="muted">Conteúdo transcrito do PDF enviado para a WikiPro.</p>',
              ''
          )

          file.write_text(content, encoding="utf-8")
          PY

          node --check _site/js/script.js
          test -f _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar WikiPro
        id: deployment
        uses: actions/deploy-pages@v4
        
