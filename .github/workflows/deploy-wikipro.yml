
name: Publicar WikiPro

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-wikipro.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar ZIP antigo
        run: |
          git show 54c888daba3b116f012d0b7910831f6eb546f818:WikiPro-Nova.zip > WikiPro-Nova.zip
          file WikiPro-Nova.zip
          unzip -tq WikiPro-Nova.zip

      - name: Preparar site
        run: |
          rm -rf _site _site_extracted
          mkdir -p _site _site_extracted
          unzip -q WikiPro-Nova.zip -d _site_extracted
          cp -a _site_extracted/wikipro/. _site/
          test -f _site/index.html
          test -f _site/images/dificuldade/0.webp
          test -f _site/images/dificuldade/1.webp

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
